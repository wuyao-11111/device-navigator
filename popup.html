<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设备导航</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><img src="icons/icon48.png" alt="" /></div>
          <div>
            <p class="eyebrow">DEVICE / OMS</p>
            <h1>设备导航</h1>
          </div>
        </div>
        <span class="version-chip" id="versionChip">v1.0.3</span>
      </header>

      <section class="device-panel" aria-labelledby="device-heading">
        <div class="device-label">
          <span class="status-dot" id="deviceDot" aria-hidden="true"></span>
          <p class="section-kicker">DEVICE ID</p>
        </div>
        <div class="device-id-row">
          <h2 id="deviceHeading">未识别</h2>
          <div class="device-id-actions">
            <button class="icon-button subtle" id="readClipboardButton" type="button" title="重新读取剪贴板" aria-label="重新读取剪贴板">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="3" width="8" height="4" rx="1" />
                <path d="M16 5h2a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2h2M8 11h8M8 15h5" />
              </svg>
            </button>
            <button class="icon-button subtle" id="copyIdButton" type="button" title="复制设备 ID" aria-label="复制设备 ID" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="10" height="10" rx="1.5" />
                <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1M13 13h2M13 16h4" />
              </svg>
            </button>
          </div>
        </div>
        <p class="device-meta" id="deviceMeta">先读取一个包含 /devices/detail/ 的链接</p>
      </section>

      <section class="actions-panel" aria-labelledby="actions-heading">
        <div class="section-heading compact">
          <div>
            <p class="section-kicker">OPEN IN NEW TABS</p>
            <h2 id="actions-heading">快捷入口</h2>
          </div>
        </div>
        <button class="primary-action" id="openAllButton" type="button" disabled>
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1" /><rect x="13" y="4" width="8" height="7" rx="1" /><rect x="3" y="13" width="8" height="7" rx="1" /><rect x="13" y="13" width="8" height="7" rx="1" /></svg>
          </span>
          <span class="action-copy"><strong>全部打开</strong><small>首页、设备信息、状态</small></span>
          <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
        <div class="quick-grid">
          <button class="quick-action" data-page="home" type="button" disabled>
            <span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z" /><path d="M9 21v-7h6v7" /></svg></span>
            <span>首页</span>
          </button>
          <button class="quick-action" data-page="info" type="button" disabled>
            <span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg></span>
            <span>设备信息</span>
          </button>
          <button class="quick-action" data-page="stats" type="button" disabled>
            <span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16" /><path d="m7 15 3-4 3 2 5-7" /></svg></span>
            <span>状态</span>
          </button>
        </div>
      </section>

      <footer class="app-footer">
        <span class="footer-led" aria-hidden="true"></span>
        <span id="footerMessage">所有页面都会在新标签页打开</span>
        <button class="update-button" id="updateButton" type="button" title="检查更新" aria-label="检查更新">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 0 0-14.8-4.2L3 9M3 4v5h5M4 13a8 8 0 0 0 14.8 4.2L21 15M21 20v-5h-5" />
          </svg>
          <span>检查更新</span>
        </button>
        <a class="update-link" id="updateLink" href="#" target="_blank" rel="noreferrer" hidden>检查更新</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
